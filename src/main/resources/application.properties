spring.application.name=fixlog
spring.config.import=optional:file:.env.properties
server.servlet.context-path=/fixlog

# Google OAuth2 Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# DataSource
spring.datasource.jdbc-url=jdbc:postgresql://${DB_URL}/fixlog
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway — 스키마 변경은 db/migration 스크립트로만 수행한다
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 이미 테이블이 있는 기존 개발 DB를 V1 baseline으로 표시하고 넘어간다
spring.flyway.baseline-on-migrate=true

# JPA — 스키마 생성은 Flyway가 맡고 Hibernate는 엔티티와 일치하는지 검증만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS
cors.allowed-origins=http://localhost:5173

# OAuth2
oauth2.success-redirect-url=http://localhost:5173/login/callback

# Spring AI - OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-4o
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.embedding.model=text-embedding-3-small

# Spring AI - Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.embedding.model=nomic-embed-text

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=1209600000

# Swagger server URL
swagger.server-url=http://localhost:8080/fixlog

# OAuth2 Swag redirect URL
oauth2.swag-redirect-url=http://localhost:8080/fixlog/login/swag/callback

# Disable pgvector auto-configuration (custom VectorStoreConfig used instead)
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Spring AI - Google Gemini (LLM + Embedding)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview
spring.ai.google.genai.chat.options.temperature=0.2

# AI 한도와 단가표 (I-02: 워크스페이스당 월 토큰, I-03: 설정 파일 관리)
fixlog.ai.free-monthly-token-limit=200000
fixlog.ai.free-model=gemini-3-flash-preview
# 1,000 토큰당 단가 (USD). 집계 시점 값이 사용 기록에 함께 저장된다
fixlog.ai.pricing.gemini-3-flash-preview.input=0.000075
fixlog.ai.pricing.gemini-3-flash-preview.output=0.0003
fixlog.ai.pricing.gpt-4o.input=0.0025
fixlog.ai.pricing.gpt-4o.output=0.01
fixlog.ai.pricing.text-embedding-3-small.input=0.00002
fixlog.ai.pricing.text-embedding-3-small.output=0

# 사용자 API Key 암호화용 대칭키 (base64 32바이트)
fixlog.encryption.key=${ENCRYPTION_KEY}
