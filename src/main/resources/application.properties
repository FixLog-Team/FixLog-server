spring.application.name=fixlog
spring.config.import=optional:file:.env.properties
server.servlet.context-path=/fixlog

# Google OAuth2 Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# DataSource
spring.datasource.jdbc-url=jdbc:postgresql://${DB_URL}/fixlog
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway — 스키마 변경은 db/migration 스크립트로만 수행한다
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 이미 테이블이 있는 기존 개발 DB를 V1 baseline으로 표시하고 넘어간다
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# JPA — 스키마 생성은 Flyway가 맡고 Hibernate는 엔티티와 일치하는지 검증만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS
cors.allowed-origins=http://localhost:5173,https://fix-log-front-theta.vercel.app

# OAuth2
oauth2.success-redirect-url=http://localhost:5173/login/callback

# Spring AI - OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-4o
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.embedding.model=text-embedding-3-small

# Spring AI - Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.embedding.model=nomic-embed-text

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=1209600000

# Swagger server URL
swagger.server-url=http://localhost:8080/fixlog

# OAuth2 Swag redirect URL
oauth2.swag-redirect-url=http://localhost:8080/fixlog/login/swag/callback

# OAuth2 모바일 앱(Custom Tabs) 로그인 — 허용 딥링크(정확히 일치할 때만 통과)와 1회용 코드 수명(초)
oauth2.app-redirect-uris=kr.co.fixlog://oauth2callback
oauth2.app-code-ttl-seconds=60

# Disable pgvector auto-configuration (custom VectorStoreConfig used instead)
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Mail (Gmail App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME}
app.frontend-url=${FRONTEND_URL:https://fix-log-front-theta.vercel.app}

# FixLog 문서 - 문서당 히스토리 보존 개수 (초과 시 오래된 버전부터 삭제)
fixlog.document.history.retention=50

# FixLog AI - QA 검색 유사도 threshold (0~1, 낮은 유사도 청크를 LLM 컨텍스트에서 제외)
fixlog.ai.qa.similarity-threshold=0.35
# FixLog AI - 대화방 맥락 윈도우 (프롬프트에 포함할 최근 완료 메시지 수)
fixlog.ai.chat.history-window=20
# FixLog AI - 대화방 RAG 검색 문서 수
fixlog.ai.chat.top-k=3
# FixLog AI - 이미지 분석 텍스트 길이 상한 (모델이 과도하게 길게 답해도 색인 비용이 튀지 않게 한다)
fixlog.ai.image.max-analysis-length=4000
# FixLog AI - 워크스페이스별 하루 비전 분석 호출 상한 (폭주 방어. 해시 재사용 건은 세지 않는다)
fixlog.ai.image.daily-analysis-limit=300

# FixLog 이미지 정비 - 고아 정리 유예 시간(시). 막 올라와 아직 문서에 붙기 전인 이미지를 지키는 값
fixlog.image.cleanup.grace-hours=24
# 고아 이미지 정리 (매일 04:00)
fixlog.image.cleanup.cron=0 0 4 * * *
# 상한에 걸려 보류된 이미지 분석 재시도 (매일 05:00, 상한이 날짜로 초기화된 뒤)
fixlog.image.pending-retry.cron=0 0 5 * * *

# Spring AI - Google Gemini (LLM + Embedding)
spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:}

# OCI Object Storage — S3 호환 API
oci.storage.endpoint=${OCI_STORAGE_ENDPOINT}
oci.storage.bucket=${OCI_STORAGE_BUCKET}
oci.storage.access-key=${OCI_ACCESS_KEY}
oci.storage.secret-key=${OCI_SECRET_KEY}
oci.storage.region=${OCI_STORAGE_REGION}

# 이미지 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.temperature=0.2

# FixLog 연관 문서 — 문서의 기존 청크 벡터로 이웃을 찾는다 (임베딩 재호출 없음)
# 임계값: 낮추면 엉뚱한 문서가 섞인다. 연관 없는 목록을 보여주느니 비워 두는 편이 낫다
fixlog.related.similarity-threshold=0.5
# 질의로 쓸 소스 청크 수. 긴 문서가 쿼리 수를 무한정 늘리지 않게 묶는다
fixlog.related.source-chunk-limit=5
# 소스 청크 하나당 가져올 이웃 수
fixlog.related.neighbors-per-chunk=20
fixlog.related.excerpt-length=200

fixlog.vectorstore.table-name=document_embeddings
