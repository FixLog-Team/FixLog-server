# VectorStoreConfig가 DataSourceBuilder로 DataSource를 직접 만들므로 메인 설정과 같이 jdbc-url을 쓴다
spring.datasource.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 마이그레이션은 Postgres 전용이므로 H2 테스트에서는 끄고 Hibernate가 스키마를 만든다
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
cors.allowed-origins=http://localhost:5173
oauth2.success-redirect-url=http://localhost:5173/login/callback
jwt.secret=test-secret-key-for-testing-only-must-be-long-enough
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=1209600000
spring.ai.openai.api-key=test-openai-api-key
spring.ai.google.genai.api-key=test-google-ai-api-key
# pgvector DDL은 H2에서 실행되지 않는다
fixlog.vectorstore.initialize-schema=false
# 이 파일이 메인 application.properties를 가리므로 자동설정 제외도 여기서 다시 선언해야 한다.
# 빠지면 자동설정의 vectorStore 빈이 VectorStoreConfig의 것과 충돌해 컨텍스트가 뜨지 않는다.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
