plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1'
description = 'fixlog'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// DB 스키마 마이그레이션 — 스키마 변경은 db/migration 스크립트로만 수행한다.
	// Boot 4부터 Flyway 자동설정이 별도 모듈이라 flyway-core만 넣으면 마이그레이션이 실행되지 않는다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
	implementation 'org.apache.commons:commons-lang3:3.18.0'
	// Spring AI OpenAI (text-embedding-3-small 임베딩 전용)
	implementation 'org.springframework.ai:spring-ai-starter-model-openai:2.0.0-M6'
	// Spring AI Google Gemini (LLM)
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai:2.0.0-M6'
	// Spring AI pgvector (벡터 DB)
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector:2.0.0-M6'
	// PostgreSQL driver (main DB + pgvector)
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'com.itextpdf:itext7-core:7.2.5'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
